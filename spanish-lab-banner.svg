  <!-- Hero wordmark -->
  <text x="436" y="585"
        font-family="Inter, Söhne, system-ui, -apple-system, sans-serif"
        font-size="158" font-weight="800"
        fill="#1A1A1A" letter-spacing="0">Spanish Lab.</text>

  <!-- Korean subtitle -->
  <text x="440" y="649"
        font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif"
