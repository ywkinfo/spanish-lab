  <!-- Eyebrow: short rule + uppercase tagline -->
  <line x1="440" y1="428" x2="496" y2="428" stroke="#C8623E" stroke-width="2.5" stroke-linecap="round"/>
  <text x="518" y="436"
        font-family="Inter, Söhne, system-ui, -apple-system, sans-serif"
