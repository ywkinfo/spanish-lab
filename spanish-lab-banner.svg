<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 1152" width="2048" height="1152" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Spanish Lab — 스페인어 연구소">

  <!-- Background -->
  <rect width="2048" height="1152" fill="#F2EBE0"/>

